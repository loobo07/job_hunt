services:
  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: job_hunt
      POSTGRES_USER: job_hunt
      POSTGRES_PASSWORD: job_hunt
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_hunt -d job_hunt"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
