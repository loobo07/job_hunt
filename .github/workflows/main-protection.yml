name: Main Branch Protection

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical-backend-tests:
    name: critical-backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: job_hunt
          POSTGRES_USER: job_hunt
          POSTGRES_PASSWORD: job_hunt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_hunt -d job_hunt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://job_hunt:job_hunt@localhost:5432/job_hunt

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Run critical backend tests
        run: uv run pytest tests/test_api.py tests/test_storage.py

  full-regression:
    name: full-regression
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Run full backend regression suite
        run: uv run pytest
